[package]
name = "laap-harness"
version = "0.2.0"
edition = "2021"

[lib]
name = "laap_harness"
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3", "abi3-py311", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
