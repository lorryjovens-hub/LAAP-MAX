[package]
name = "laap-core"
version = "0.1.0"
edition = "2021"
description = "LAAP AGI Framework — Rust native acceleration core"

[lib]
name = "laap_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
ahash = "0.8"
rayon = "1.9"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.13"
dashmap = "5.5"
fxhash = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"