<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e2e;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .timer {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
        }
        svg {
            transform: rotate(-90deg);
            display: block;
        }
        .track {
            fill: none;
            stroke: #3a3a4a;
            stroke-width: 8;
        }
        .progress {
            fill: none;
            stroke: #50fa7b;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        .time-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            background: #3a3a4a;
            color: #f0f0f0;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.2s;
            min-width: 120px;
            font-weight: 500;
        }
        button:hover {
            background: #4a4a5a;
        }
        button:active {
            transform: scale(0.97);
        }
        button.reset {
            background: #e74c3c;
        }
        button.reset:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timer">
            <svg width="280" height="280" viewBox="0 0 280 280">
                <circle class="track" cx="140" cy="140" r="120"/>
                <circle class="progress" id="progress" cx="140" cy="140" r="120"
                    stroke-dasharray="753.98" stroke-dashoffset="0"/>
            </svg>
            <div class="time-text" id="display">25:00</div>
        </div>
        <div class="buttons">
            <button id="startPauseBtn">Start</button>
            <button id="resetBtn" class="reset">Reset</button>
        </div>
    </div>
    <script>
        (function() {
            const totalSeconds = 25 * 60;
            let timeLeft = totalSeconds;
            let running = false;
            let interval = null;

            const display = document.getElementById('display');
            const progress = document.getElementById('progress');
            const startPauseBtn = document.getElementById('startPauseBtn');
            const resetBtn = document.getElementById('resetBtn');

            const circumference = 2 * Math.PI * 120; // ~753.98

            function updateDisplay() {
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                const offset = circumference * (1 - timeLeft / totalSeconds);
                progress.style.strokeDashoffset = offset;
            }

            function startTimer() {
                if (running) return;
                running = true;
                startPauseBtn.textContent = 'Pause';
                interval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(interval);
                        running = false;
                        startPauseBtn.textContent = 'Start';
                        // Optional: play sound, but we keep minimal
                    }
                }, 1000);
            }

            function pauseTimer() {
                if (!running) return;
                clearInterval(interval);
                running = false;
                startPauseBtn.textContent = 'Start';
            }

            function resetTimer() {
                clearInterval(interval);
                running = false;
                timeLeft = totalSeconds;
                startPauseBtn.textContent = 'Start';
                updateDisplay();
            }

            startPauseBtn.addEventListener('click', () => {
                if (running) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            });

            resetBtn.addEventListener('click', resetTimer);

            // initial display
            updateDisplay();
        })();
    </script>
</body>
</html>
