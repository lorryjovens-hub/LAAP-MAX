<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        /* ── Reset & Base ─────────────────────────────────────────── */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0b0f;
            --bg-secondary: #14141a;
            --text-primary: #e8e8f0;
            --text-muted:    #6b6b7a;
            --accent:        #f05c5c;
            --accent-hover:  #f07c7c;
            --accent-glow:   rgba(240, 92, 92, 0.18);
            --ring-bg:       #252530;
            --ring-fill:     var(--accent);
            --btn-bg:        #1e1e2a;
            --btn-hover:     #2a2a3a;
            --shadow-color:  rgba(0, 0, 0, 0.55);
            --radius:        14px;
            --transition:    0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ── Card ─────────────────────────────────────────────────── */
        .timer-card {
            background: var(--bg-secondary);
            border-radius: calc(var(--radius) * 2);
            padding: 2.5rem 2.8rem 2.8rem;
            box-shadow:
                0 20px 50px var(--shadow-color),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            max-width: 480px;
            width: 100%;
            text-align: center;
            transition: var(--transition);
        }

        /* ── Title ────────────────────────────────────────────────── */
        .title {
            font-weight: 500;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* ── Circular progress ────────────────────────────────────── */
        .ring-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 1.75rem;
        }

        .ring-container svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 18px var(--accent-glow));
        }

        .ring-bg {
            fill: none;
            stroke: var(--ring-bg);
            stroke-width: 6;
        }

        .ring-fill {
            fill: none;
            stroke: var(--ring-fill);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 754;          /* circumference for r=120 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.45s ease-out, stroke 0.3s;
        }

        /* ── Center time display ──────────────────────────────────── */
        .time-display {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .time-display .minutes {
            font-size: 4.2rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        .time-display .seconds {
            font-size: 4.2rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        .time-display .separator {
            font-size: 3rem;
            font-weight: 200;
            color: var(--text-muted);
            margin: 0 0.1rem;
        }

        .time-row {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .phase-label {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ── Controls ─────────────────────────────────────────────── */
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.25rem;
        }

        .btn {
            background: var(--btn-bg);
            border: none;
            color: var(--text-primary);
            padding: 0.75rem 1.75rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background var(--transition), transform 0.15s, box-shadow var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-width: 100px;
        }

        .btn:hover {
            background: var(--btn-hover);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 6px 28px var(--accent-glow);
        }

        .btn-outline {
            border: 1px solid var(--ring-bg);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
        }

        .btn-icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ── Session counter ──────────────────────────────────────── */
        .session-count {
            margin-top: 1.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .session-count span {
            color: var(--accent);
            font-weight: 600;
        }

        /* ── Mode badges ──────────────────────────────────────────── */
        .mode-badge {
            display: inline-block;
            margin-top: 0.3rem;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(240, 92, 92, 0.12);
            color: var(--accent);
            border: 1px solid rgba(240, 92, 92, 0.2);
        }

        .mode-badge.break {
            background: rgba(100, 180, 255, 0.1);
            color: #64b4ff;
            border-color: rgba(100, 180, 255, 0.2);
        }

        /* ── Responsive ───────────────────────────────────────────── */
        @media (max-width: 480px) {
            .timer-card {
                padding: 1.8rem 1.2rem 2rem;
            }

            .ring-container {
                width: 200px;
                height: 200px;
            }

            .time-display .minutes,
            .time-display .seconds {
                font-size: 3.2rem;
            }

            .time-display .separator {
                font-size: 2.2rem;
            }

            .btn {
                padding: 0.6rem 1.2rem;
                min-width: 75px;
                font-size: 0.9rem;
            }

            .controls {
                gap: 0.65rem;
            }
        }

        @media (max-width: 360px) {
            .ring-container {
                width: 160px;
                height: 160px;
            }

            .time-display .minutes,
            .time-display .seconds {
                font-size: 2.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ════════════════  MARKUP  ═══════════════════════════════════ -->
    <main class="timer-card" role="main" aria-label="Pomodoro timer">

        <h1 class="title">Pomodoro</h1>

        <!-- ── Ring + Time ────────────────────────────────────────── -->
        <div class="ring-container">

            <svg viewBox="0 0 260 260" aria-hidden="true">
                <!-- background ring -->
                <circle class="ring-bg" cx="130" cy="130" r="120" />
                <!-- progress ring -->
                <circle class="ring-fill" id="progressRing" cx="130" cy="130" r="120" />
            </svg>

            <div class="time-display">
                <div class="time-row">
                    <span class="minutes" id="minutesDisplay">25</span>
                    <span class="separator">:</span>
                    <span class="seconds" id="secondsDisplay">00</span>
                </div>
                <div class="phase-label" id="phaseLabel">Focus</div>
            </div>

        </div>

        <!-- ── Controls ───────────────────────────────────────────── -->
        <div class="controls">

            <button class="btn btn-primary btn-icon" id="mainBtn" aria-label="Start timer">
                <svg id="mainIcon" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <span id="mainBtnText">Start</span>
            </button>

            <button class="btn btn-outline btn-icon" id="resetBtn" aria-label="Reset timer">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
                Reset
            </button>

        </div>

        <!-- ── Session counter ────────────────────────────────────── -->
        <div class="session-count">
            Sessions completed: <span id="sessionCount">0</span>
        </div>

        <div id="modeBadgeContainer">
            <span class="mode-badge" id="modeBadge">Focus</span>
        </div>

    </main>

    <!-- ════════════════  SCRIPT  ═══════════════════════════════════ -->
    <script>
        (function() {
            'use strict';

            // ─── Constants ─────────────────────────────────────────
            const WORK_TIME  = 25 * 60;   // 25 minutes
            const BREAK_TIME =  5 * 60;   //  5 minutes
            const CIRCUMFERENCE = 754;     // 2 * π * 120 ≈ 753.98

            // ─── State ─────────────────────────────────────────────
            let timerInterval   = null;
            let remaining       = WORK_TIME;
            let isRunning       = false;
            let isWorkMode      = true;
            let sessions        = 0;

            // ─── DOM refs ─────────────────────────────────────────
            const minutesEl     = document.getElementById('minutesDisplay');
            const secondsEl     = document.getElementById('secondsDisplay');
            const phaseLabel    = document.getElementById('phaseLabel');
            const modeBadge     = document.getElementById('modeBadge');
            const progressRing  = document.getElementById('progressRing');
            const mainBtn       = document.getElementById('mainBtn');
            const mainIcon      = document.getElementById('mainIcon');
            const mainBtnText   = document.getElementById('mainBtnText');
            const resetBtn      = document.getElementById('resetBtn');
            const sessionCountEl= document.getElementById('sessionCount');

            // ─── Helpers ──────────────────────────────────────────
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return {
                    minutes: m.toString().padStart(2, '0'),
                    seconds: s.toString().padStart(2, '0'),
                };
            }

            function updateDisplay(seconds) {
                const { minutes, seconds: secs } = formatTime(seconds);
                minutesEl.textContent = minutes;
                secondsEl.textContent = secs;
            }

            function updateRing(seconds) {
                const total = isWorkMode ? WORK_TIME : BREAK_TIME;
                const progress = total > 0 ? (total - seconds) / total : 0;
                const offset = CIRCUMFERENCE * progress;
                progressRing.style.strokeDashoffset = offset;
            }

            function updateUI() {
                updateDisplay(remaining);
                updateRing(remaining);
            }

            function updateLabels() {
                const label = isWorkMode ? 'Focus' : 'Break';
                phaseLabel.textContent = label;
                modeBadge.textContent = label;
                modeBadge.className = 'mode-badge' + (isWorkMode ? '' : ' break');

                // ring colour
                progressRing.style.stroke = isWorkMode
                    ? 'var(--accent)'
                    : '#64b4ff';
            }

            function updateSessionCount() {
                sessionCountEl.textContent = sessions;
            }

            function setMainButtonState(state) {
                // state: 'start' | 'pause' | 'resume'
                const icon = mainIcon;
                const text = mainBtnText;

                if (state === 'start') {
                    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                    text.textContent = 'Start';
                    mainBtn.setAttribute('aria-label', 'Start timer');
                } else if (state === 'pause') {
                    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                    text.textContent = 'Pause';
                    mainBtn.setAttribute('aria-label', 'Pause timer');
                } else { // resume
                    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                    text.textContent = 'Resume';
                    mainBtn.setAttribute('aria-label', 'Resume timer');
                }
            }

            // ─── Core logic ───────────────────────────────────────
            function switchMode() {
                isWorkMode = !isWorkMode;

                if (isWorkMode) {
                    remaining = WORK_TIME;
                } else {
                    remaining = BREAK_TIME;
                }

                updateLabels();
                updateUI();
            }

            function tick() {
                if (remaining <= 0) {
                    // Timer finished
                    stopTimer();

                    if (isWorkMode) {
                        // Work session completed → increment sessions
                        sessions++;
                        updateSessionCount();
                    }

                    // Play notification sound (if available)
                    try {
                        const ctx = new (window.AudioContext || window.webkitAudioContext)();
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = 880;
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.8);
                    } catch (_) { /* silent fallback */ }

                    // Visual flash feedback
                    document.body.style.transition = 'background 0.2s';
                    document.body.style.background = isWorkMode
                        ? 'rgba(100, 180, 255, 0.08)'
                        : 'rgba(240, 92, 92, 0.08)';
                    setTimeout(() => {
                        document.body.style.background = '';
                    }, 400);

                    switchMode();
                    setMainButtonState('start');
                    return;
                }

                remaining--;
                updateUI();
            }

            function startTimer() {
                if (timerInterval) return;
                isRunning = true;
                timerInterval = setInterval(tick, 1000);
                setMainButtonState('pause');
            }

            function pauseTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isRunning = false;
                setMainButtonState('resume');
            }

            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isRunning = false;
            }

            function resetTimer() {
                stopTimer();
                // preserve mode but reset to full time
                remaining = isWorkMode ? WORK_TIME : BREAK_TIME;
                updateUI();
                setMainButtonState('start');
            }

            // ─── Event handlers ───────────────────────────────────
            function handleMainClick() {
                if (!isRunning) {
                    // If paused or stopped → start / resume
                    startTimer();
                } else {
                    // Running → pause
                    pauseTimer();
                }
            }

            function handleResetClick() {
                resetTimer();
            }

            // ─── Keyboard shortcuts ───────────────────────────────
            function handleKeydown(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    handleMainClick();
                }
                if (e.key === 'r' || e.key === 'R') {
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        handleResetClick();
                    }
                }
            }

            // ─── Initialise ───────────────────────────────────────
            function init() {
                remaining = WORK_TIME;
                isWorkMode = true;
                sessions = 0;
                updateUI();
                updateLabels();
                updateSessionCount();
                setMainButtonState('start');

                mainBtn.addEventListener('click', handleMainClick);
                resetBtn.addEventListener('click', handleResetClick);
                document.addEventListener('keydown', handleKeydown);
            }

            init();

        })();
    </script>

</body>
</html>
