    <script type="module">
        import * as THREE from 'three';

        // --- 游戏配置 ---
        const GRID_SIZE = 9;          // 9x9 经典

        let gameOver = false;

        let gameStarted = false;

        // DOM 元素
        const mineCountSpan = document.getElementById('mine-count');
        const timeDisplay = document.getElementById('time-display');
        const statusMsg = document.getElementById('status-message');
        const restartBtn = document.getElementById('restart-btn');

        // --- Three.js 场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(12, 10, 14);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // CSS2渲染器 (用于数字标签)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // 让点击穿透
        document.body.appendChild(labelRenderer.domElement);

        // 控制器 (允许玩家旋转视角)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 8;
        controls.maxDistance = 25;

        // --- 灯光 ---
        // 环境光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // 主光源 - 产生立体阴影
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(8, 15, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        const d = 12;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 25;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        fillLight.position.set(-6, 4, -8);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xffaa88, 0.3);
        backLight.position.set(-4, 2, 10);
        scene.add(backLight);

        // 地面装饰 (半透明)
        const groundGeometry = new THREE.CircleGeometry(8, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x2d2d5e,
            transparent: true,
            opacity: 0.2,
            side: THREE.DoubleSide,
            roughness: 0.8,
            metalness: 0.1
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.55;
        ground.receiveShadow = true;
        scene.add(ground);

        // 网格辅助线 (科技感)
        const gridHelper = new THREE.GridHelper(12, 12, 0x4ecdc4, 0x3a3a7a);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        // --- 核心函数 ---
        function initBoard() {
            // 重置数据结构
            board = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    board[r][c] = {
                        mine: false,
                        revealed: false,
                        flagged: false,
                        adjacentMines: 0,
                        mesh: null,
                        label: null
                    };
                }
            }

            // 随机布雷 (保证首点安全, 在第一次点击时布雷)
            // 但为了重置，先清除所有雷
            // 布雷将在第一次点击时进行
        }

        function placeMines(safeRow, safeCol) {
            // 避开安全区域 (3x3)
            let placed = 0;
            while (placed < MINE_COUNT) {
                const r = Math.floor(Math.random() * GRID_SIZE);
                const c = Math.floor(Math.random() * GRID_SIZE);
                if (board[r][c].mine) continue;
                // 安全区域
                if (Math.abs(r - safeRow) <= 1 && Math.abs(c - safeCol) <= 1) continue;
                board[r][c].mine = true;
                placed++;
            }
            // 计算数字
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c].mine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && board[nr][nc].mine) count++;
                        }
                    }
                    board[r][c].adjacentMines = count;
                }
            }
        }
