[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laap"
version = "0.3.3"
description = "LAAP - Lifeform Autonomous Adaptive Protocol (数字生命体 · 自进化引擎意识生命体) + laap_brain 认知内核"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LAAP Team", email = "laap@nousresearch.com"},
]
keywords = ["agent", "ai", "cognitive", "lifeform", "autonomous", "psi", "digital-life"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "docstring-parser>=0.15",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/laap-agi/laap"
Repository = "https://github.com/laap-agi/laap"
Documentation = "https://github.com/laap-agi/laap"

[project.optional-dependencies]
tui = ["textual>=0.60.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
deepseek = ["openai>=1.0.0"]
ollama = ["httpx>=0.27.0"]
api = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
rag = ["qdrant-client>=1.9.0", "sentence-transformers>=2.2.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]
all = [
    "laap[tui,openai,anthropic,deepseek,api,rag,dev]",
]

[project.scripts]
laap = "laap.__main__:main"

[tool.setuptools.packages.find]
include = ["laap*"]
