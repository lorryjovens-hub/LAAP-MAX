# jspace-laap-global-workspace-paper 实验统一配置
# 本文件由 Task 2 创建，供 Task 3/4/5 的微观/中观/宏观实验共享。

meta:
  project: jspace-laap-global-workspace-paper
  version: "0.1.0"
  description: "LAAP 全局工作空间理论验证实验框架"

# 实验编号与名称映射
experiments:
  micro:
    id: exp_micro_jlens
    name: J-lens 微观层因果可解释性实验
    description: 在源模型内部识别并解释导致工作空间广播的因果 token 集合。
    module: experiments.jspace_laap.exp_micro_jlens
  meso:
    id: exp_meso_cognitivebus
    name: CognitiveBus 中观层报告性与调制实验
    description: 验证 CognitiveBus 的 reportability、modulation 与跨模块信息整合指标。
    module: experiments.jspace_laap.exp_meso_cognitivebus
  macro:
    id: exp_macro_psinet
    name: Ψ-Net 宏观层多实例协调实验
    description: 在多实例 Ψ-Net 中观察全局广播、共识形成与涌现协调行为。
    module: experiments.jspace_laap.exp_macro_psinet

# 微观层：J-lens 参数
jlens:
  source_layers:
    - name: embedding
      idx: 0
    - name: early_attn
      idx: 2
    - name: mid_attn
      idx: 8
    - name: late_attn
      idx: 14
  corpus_sequences:
    - "The cat sat on the mat and looked at the window."
    - "If it rains tomorrow, the outdoor concert will be cancelled."
    - "She concluded that the hypothesis was supported by the data."
    - "The algorithm learned to recognize patterns in noisy inputs."
    - "Because the model updated its weights, the loss decreased."
  sequence_length: 32
  topk: 5
  activation_threshold: 0.15
  attribution_method: integrated_gradients
  n_samples_per_sequence: 10

# 中观层：CognitiveBus 实验参数
cognitivebus:
  tick_interval_ms: 50
  reportability_samples: 200
  modulation_samples: 200
  capacity_limit: 7
  broadcast_timeout_ms: 500
  modules:
    - perception
    - memory
    - reasoning
    - action
    - language

# 宏观层：Ψ-Net 实验参数
psinet:
  instances: 5
  rounds: 100
  base_port: 37000
  ports: [37000, 37001, 37002, 37003, 37004]
  consensus_threshold: 0.75
  message_dropout_prob: 0.05
  latency_ms: 10

# 统计参数
statistics:
  significance_level: 0.05
  random_seed: 42
  n_bootstrap: 1000
  confidence_level: 0.95

# 输出路径（相对于 experiments/jspace_laap/）
paths:
  root: .
  cache: ./cache
  data: ./data
  figures_zh: ./figures/zh
  figures_en: ./figures/en
  literature: ./literature
  reports: ./reports

# 日志配置
logging:
  level: INFO
  format: "[{component}] {message}"
  file: ./reports/experiments.log
