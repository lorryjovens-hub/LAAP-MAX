name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy pytest-cov
      - name: Lint with ruff
        run: ruff check laap/ laap_brain/ aris_brain/
      - name: Type check with mypy
        run: mypy laap --ignore-missing-imports || true  # 起步阶段不阻断
      - name: Lint hardcoded absolute paths
        run: python scripts/lint_hardcoded_paths.py
      - name: Test with pytest
        run: pytest tests/ -v --cov=laap --cov=laap_brain --cov-report=term-missing
