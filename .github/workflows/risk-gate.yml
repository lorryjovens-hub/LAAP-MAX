name: Risk Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install pytest pyyaml numpy
      - name: Run risk gate
        run: |
          cd harness
          python -m pytest --risk-gate -p laap_coding.core.risk_gate_plugin -p no:quadrants
