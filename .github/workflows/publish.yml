name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  # ── Gate: version consistency check ────────────────────────
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "value=${VER}" >> $GITHUB_OUTPUT
          echo "Source version = ${VER}"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            echo "Release tag = ${TAG}"
            [ "${VER}" = "${TAG}" ] || [ "${VER}" = "${TAG#v}" ] || { echo "VERSION MISMATCH!"; exit 1; }
          fi

  # ── Build from source ──────────────────────────────────────
  build:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Publish to PyPI (trusted publishing) ───────────────────
  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/laap
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false

  # ── Create GitHub Release + Changelog ──────────────────────
  github-release:
    needs: [version-check, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          echo "Previous tag: ${PREV_TAG}"
          if [ -n "${PREV_TAG}" ]; then
            echo 'CHANGELOG<<EOF' >> $GITHUB_OUTPUT
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%an)" >> $GITHUB_OUTPUT
            echo '' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          else
            echo 'CHANGELOG<<EOF' >> $GITHUB_OUTPUT
            echo '- Initial release' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: "LAAP v${{ needs.version-check.outputs.version }} — Living Agent Application Protocol"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Install

            ```bash
            uv tool install laap
            ```

            ## Hashes
          files: dist/*