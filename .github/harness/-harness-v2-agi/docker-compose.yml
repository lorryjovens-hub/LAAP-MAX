version: "3.8"

services:
  harness-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HARNESS_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./sandbox:/app/sandbox
    depends_on:
      - redis
      - chroma
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  harness-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.main.celery_app worker --loglevel=info --concurrency=4
    environment:
      - HARNESS_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./sandbox:/app/sandbox
    depends_on:
      - redis
      - chroma
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  chroma:
    image: chromadb/chroma:0.5.0
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./scripts/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-harness}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scripts/grafana-dashboards:/etc/grafana/provisioning/dashboards

volumes:
  redis-data:
  chroma-data:
  prometheus-data:
  grafana-data:
