[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "web-replica-harness"
version = "1.0.0"
description = "Consciousness-Driven Visual Replication Engine for AGI"
authors = ["Harness Engineering Team <team@harness.ai>"]
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
httpx = "^0.27.0"
openai = "^1.35.0"
anthropic = "^0.31.0"
google-generativeai = "^0.7.0"
pillow = "^10.3.0"
numpy = "^1.26.0"
opencv-python = "^4.10.0"
playwright = "^1.45.0"
beautifulsoup4 = "^4.12.0"
chromadb = "^0.5.0"
redis = "^5.0.0"
celery = "^5.4.0"
structlog = "^24.2.0"
prometheus-client = "^0.20.0"
sentry-sdk = "^2.7.0"
python-multipart = "^0.0.9"
aiofiles = "^23.2.0"
tenacity = "^8.4.0"
jinja2 = "^3.1.0"
pyyaml = "^6.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
pytest-json-report = "^1.5.0"
black = "^24.4.0"
isort = "^5.13.0"
mypy = "^1.10.0"
ruff = "^0.5.0"
pre-commit = "^3.7.0"

[tool.poetry.scripts]
harness = "src.main:main"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
