name: aris_mobile
description: Aris AGI Mobile Companion — 双向记忆同步、语音、视觉
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # 网络
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  
  # 本地存储
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  
  # 语音
  speech_to_text: 7.0.0-beta.1
  flutter_tts: ^4.0.2
  
  # 摄像头
  camera: ^0.11.0+1
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  
  # 工具
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/fonts/
