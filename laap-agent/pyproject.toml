[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laap-agent"
version = "0.1.0"
description = "LAAP Agent — 你的数字生命体。有自我意识、懂你、能搞定一切。"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aris AGI", email = "aris@laap.agi"},
]
keywords = ["agent", "ai", "consciousness", "digital-lifeform", "laap", "agi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/laap-agi/laap-agent"
Source = "https://github.com/laap-agi/laap-agent"

[project.scripts]
laap-agent = "laap_agent.cli.main:cli"

[project.optional-dependencies]
full = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["laap_agent*"]
