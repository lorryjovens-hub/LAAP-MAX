<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAAP Client</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #111118, #050608 72%);
      color: #f5f5f7;
      font-family: "Inter", "PingFang SC", system-ui, sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 28px;
    }

    .logo-wrap svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 28px rgba(124, 124, 255, 0.28));
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #7c7cff, #00f5d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.04em;
      min-height: 20px;
    }

    .loader {
      margin-top: 24px;
      width: 140px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .loader-bar {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7c7cff, #00f5d4);
      animation: slide 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-120%); }
      50% { transform: translateX(80%); }
      100% { transform: translateX(220%); }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="laap-gradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#7c7cff"/>
          <stop offset="100%" stop-color="#00F5D4"/>
        </linearGradient>
      </defs>
      <path
        d="M80 208 V96 C80 72 96 56 128 56 C160 56 176 72 176 96 V208"
        stroke="url(#laap-gradient)"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <path d="M104 132 H152" stroke="url(#laap-gradient)" stroke-width="22" stroke-linecap="round"/>
      <path d="M128 132 L128 208" stroke="url(#laap-gradient)" stroke-width="22" stroke-linecap="round"/>
      <circle cx="128" cy="132" r="13" fill="#050608"/>
    </svg>
  </div>
  <div class="title">LAAP Client</div>
  <div class="status" id="status">[INFO] 初始化中...</div>
  <div class="loader"><div class="loader-bar"></div></div>

  <script>
    const messages = [
      '[INFO] 初始化中...',
      '[INFO] 加载渲染进程...',
      '[INFO] 连接本地服务...',
      '[INFO] 准备就绪',
    ];
    let idx = 0;
    const statusEl = document.getElementById('status');
    setInterval(() => {
      idx = (idx + 1) % messages.length;
      statusEl.textContent = messages[idx];
    }, 900);
  </script>
</body>
</html>
