[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triphase"
version = "0.1.0"
description = "三值/复相位 AGI Agent 框架参考实现：CRM 记忆、假设生态、元认知、SPIR 反思、三值代码图、因果张量引擎、省 token 管线、注意力 harness、相位世界模型"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["triphase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
